name: Build Gemini Items Fix Image

on:
  push:
    branches:
      - fix/gemini-raw-chat-array-items

permissions:
  contents: read
  packages: write

env:
  IMAGE_VERSION: 0.2.1-opencode-session-affinity-20260910

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Gemini raw chat schema normalization
        working-directory: backend
        run: >-
          go test ./internal/service
          -run '^(TestNormalizeGeminiRawChatToolSchemas|TestApplyOpenCodeSessionAffinityHeaderRequiresExplicitAccountOptIn|TestOpenCodeSessionAffinityForwardedToExplicitlyTrustedCPAOnAllOpenAIPaths)$'
          -count=1

  build-image:
    needs: regression-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}
            ${{ steps.image.outputs.name }}:gemini-itemsfix
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
